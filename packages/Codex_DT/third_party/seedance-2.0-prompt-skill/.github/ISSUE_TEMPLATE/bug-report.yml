name: Skill or validator bug
description: Report incorrect routing, prompt construction, validation, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the skill. Remove private files, credentials, and personal data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Dreamina
        - Volcengine / Jimeng
        - BytePlus ModelArk API
        - Fal
        - Higgsfield
        - MuAPI
        - Generic / other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: User request or validator command
      description: Include a minimal reproducible request. Redact private media paths and URLs.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting source or evidence
      description: Add an official/provider URL or explain why this is a heuristic.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and rights
      options:
        - label: I removed credentials, private media, personal data, and unauthorized likenesses.
          required: true
